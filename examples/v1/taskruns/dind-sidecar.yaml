apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: dind-sidecar-
spec:
  taskSpec:
    steps:
    - image: registry
      name: client
      env:
      # Connect to the sidecar over TCP, with TLS.
      - name: registry_HOST
        value: tcp://localhost:2376
      # Verify TLS.
      - name: registry_TLS_VERIFY
        value: '1'
      # Use the certs generated by the sidecar daemon.
      - name: registry_CERT_PATH
        value: /certs/client
      workingDir: /workspace
      script: |
          #!/usr/bin/env sh
          set -e
          # Run a registry container.
          registry run busybox echo hello

          # Write a registryfile and `registry build` it.
          cat > registryfile << EOF
          FROM ubuntu
          RUN apt-get update
          ENTRYPOINT ["echo", "hello"]
          EOF
          registry build -t hello .
          registry images

          # ...then run it!
          registry run hello
      volumeMounts:
      - mountPath: /certs/client
        name: dind-certs

    sidecars:
    - image: registry@sha256:74e78208fc18da48ddf8b569abe21563730845c312130bd0f0b059746a7e10f5
      name: server
      args:
        - --storage-driver=vfs
        - --userland-proxy=false
        - --debug
      computeResources:
        requests:
          memory: "512Mi"
      securityContext:
        privileged: true
      env:
      # Write generated certs to the path shared with the client.
      - name: registry_TLS_CERTDIR
        value: /certs
      volumeMounts:
      - mountPath: /certs/client
        name: dind-certs
      # Wait for the dind daemon to generate the certs it will share with the
      # client.
      readinessProbe:
        periodSeconds: 1
        exec:
          command: ['ls', '/certs/client/ca.pem']

    volumes:
    - name: dind-certs
      emptyDir: {}
