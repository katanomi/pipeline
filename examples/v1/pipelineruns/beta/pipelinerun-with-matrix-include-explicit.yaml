apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mytask
  annotations:
    description: |
      A task that echoes image and registryfile
spec:
  params:
    - name: IMAGE
    - name: registryFILE
  steps:
    - name: echo
      image: alpine
      script: |
        echo "$(params.IMAGE) and $(params.registryFILE)"
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: explicit-combos
spec:
  taskRunTemplate:
    serviceAccountName: 'default'
  pipelineSpec:
    tasks:
      - name: matrix-include
        matrix:
          include:
            - name: build-1
              params:
                - name: IMAGE
                  value: image-1
                - name: registryFILE
                  value: path/to/registryfile1
            - name: build-2
              params:
                - name: IMAGE
                  value: image-2
                - name: registryFILE
                  value: path/to/registryfile2
            - name: build-3
              params:
                - name: IMAGE
                  value: image-3
                - name: registryFILE
                  value: path/to/registryfile3
        taskRef:
          name: mytask
